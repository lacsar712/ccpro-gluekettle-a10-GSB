services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gluekettle
      POSTGRES_USER: gluekettle
      POSTGRES_PASSWORD: gluekettle
    ports:
      - "6390:5432"
    volumes:
      - gluekettle_4990_8990_6390_pg:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U gluekettle -d gluekettle"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gluekettle:gluekettle@db:5432/gluekettle
      JWT_SECRET: gluekettle-dev-secret
    ports:
      - "8990:8790"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "4990:80"
    restart: on-failure
    depends_on:
      - backend

volumes:
  gluekettle_4990_8990_6390_pg:
